<!doctype html>
<html>
  <head>
    <title>Student Registration</title>
    <style>
      input:focus,
      select:focus {
        background-color: lightyellow;
      }
    </style>
  </head>
  <body>
    <h2>Student Registration Form</h2>

    <form id="studentForm">
      Name: <input type="text" id="name" required /><br /><br />
      Email: <input type="email" id="email" required /><br /><br />
      Mobile: <input type="tel" id="mobile" required /><br /><br />

      Gender:
      <input type="radio" name="gender" value="Male" required /> Male
      <input type="radio" name="gender" value="Female" /> Female <br /><br />

      Course:
      <select id="course" required>
        <option value="">Select Course</option>
        <option>BCA</option>
        <option>BSc</option>
        <option>BTech</option>
        <option>MCA</option></select
      ><br /><br />

      <button type="submit">Submit</button>
      <button type="reset">Reset</button>
    </form>

    <p id="message"></p>
    <p id="count"></p>

    <script>
      let form = document.getElementById("studentForm");
      let nameInput = document.getElementById("name");
      let message = document.getElementById("message");

      document.querySelectorAll("input, select").forEach(function (field) {
        field.onfocus = function () {
          field.style.border = "2px solid blue";
        };

        field.onblur = function () {
          field.style.border = "";
        };
      });

      document.getElementById("course").onchange = function () {
        message.innerHTML = "Selected Course: " + this.value;
      };

      nameInput.oninput = function () {
        document.getElementById("count").innerHTML =
          "Characters entered: " + this.value.length;
      };

      form.onsubmit = function (event) {
        event.preventDefault();
        message.innerHTML = "Registration Successful!";
      };

      form.onreset = function () {
        message.innerHTML = "";
        document.getElementById("count").innerHTML = "";
      };
    </script>
  </body>
</html>
